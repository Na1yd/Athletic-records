{% extends "layout.html" %}
{% block content %}
<form action="/submit" method="POST">
  <label for="event">Choose a distance:</label>
  <select id="event" name="events">
    {% for event in events %}
    <option value='{{ event[0] }}'>{{ event[1] }}</option>
    {% endfor %}
  </select>
  <button type="submit">Submit</button>
</form>
{% endblock %}
