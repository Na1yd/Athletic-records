<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletics records burnside</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="w3-container">
    <div class="header">
        <div class="title">
            <h1>Athletics records</h1>
        </div>
        <div class="w3-bar w3-green">
            <a href="/" class="w3-bar-item w3-button">Home</a>
            {% if session.get('user_id') %}
                <a href="/admin" class="w3-bar-item w3-button">Admin</a>
                <a href="/logout" class="w3-bar-item w3-button w3-right">Logout</a>
            {% else %}
                <a href="/login" class="w3-bar-item w3-button w3-right">Login</a>
            {% endif %}
        </div>
    </div>
        {% block content %}{% endblock %}
</body>
